
name: Compilar Ajedrez para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git zip unzip \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake

      - name: Configurar Java y SDK de Buildozer
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK"

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
          java -version

      - name: Instalar herramientas Android y aceptar licencias
        shell: bash
        run: |
          set -e

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          SOURCE_SDK=/usr/local/lib/android/sdk
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$(find "$SOURCE_SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontro sdkmanager"
            exit 1
          fi

          echo "Aceptando licencias..."
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          echo "Instalando Build-Tools 35 y plataforma Android 35..."
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Verificando AIDL..."
          find "$SDK/build-tools" -type f -name aidl -print

          if [ ! -x "$SDK/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL no se instalo en la ruta esperada"
            exit 1
          fi

          echo "AIDL instalado correctamente"

      - name: Preparar Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.34

      - name: Compilar APK
        shell: bash
        run: |
          . .venv/bin/activate
          buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajedrez-de-Madera-APK
          path: bin/*.apk
          if-no-files-found: error
          
