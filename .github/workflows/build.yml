
name: Compilar Ajedrez para Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17 y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk git zip unzip \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake

      - name: Seleccionar Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          java -version

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK y AIDL
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          sdkmanager --licenses
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Preparar Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajedrez-de-Madera-APK
          path: bin/*.apk
          if-no-files-found: error
          
